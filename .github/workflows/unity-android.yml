name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: .
          buildsPath: build
          buildName: DROPSHIP-TYCOON
          androidAppBundle: false
          androidExportType: androidPackage
          versioning: Semantic
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find build -type f -name '*.apk' -exec cp {} artifacts/DROPSHIP-TYCOON.apk \;
          test -f artifacts/DROPSHIP-TYCOON.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DROPSHIP-TYCOON-APK
          path: artifacts/DROPSHIP-TYCOON.apk
          if-no-files-found: error
          retention-days: 14
