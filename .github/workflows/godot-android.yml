name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"

      - name: Install Godot and Android export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q -j templates.tpz 'templates/android_*' 'templates/version.txt' -d "$TDIR"
          rm -f godot.zip templates.tpz
          ls -la "$TDIR"
          godot --version

      - name: Create debug keystore and Godot editor settings
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export Android APK
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-debug "Android" build/DropshipTycoon.apk 2>&1 | tee build/export.log
          if [ ! -s build/DropshipTycoon.apk ]; then
            echo "::error title=Godot export failed::$(grep -v '^\s*$' build/export.log | tail -n 25 | tr '\n' '|' )"
            exit 1
          fi
          ls -la build
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/DropshipTycoon.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dropship-Tycoon-Android-APK
          path: build/DropshipTycoon.apk
          if-no-files-found: error
          retention-days: 14
