name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Prepare export directory
        run: mkdir -p build

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/DropshipTycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dropship-Tycoon-Android-APK
          path: build/DropshipTycoon.apk
          if-no-files-found: error
          retention-days: 14
